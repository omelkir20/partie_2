---
- name: Installer Java et dépendances
  ansible.builtin.apt:
    name: [fontconfig, openjdk-21-jre-headless, ca-certificates, curl]
    state: present
    update_cache: true

- name: Ajouter la clé du dépôt Jenkins
  ansible.builtin.get_url:
    url: https://pkg.jenkins.io/debian-stable/jenkins.io-2026.key
    dest: /etc/apt/keyrings/jenkins-keyring.asc
    mode: '0644'
